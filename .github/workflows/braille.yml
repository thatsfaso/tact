name: Braille

# Every change to the page is held to liblouis, the reference braille
# translator: tests/braille/check.mjs runs the translator as it ships in
# index.html and compares every cell with the expected output. The same job
# checks the picture choice (tests/pictures).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  matches-liblouis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/braille/check.mjs
      - run: node tests/pictures/check.mjs
