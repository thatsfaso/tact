<svg width="100%" viewBox="0 0 680 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>TACT page layout geometry, picture in the top-right corner</title>
<desc>Dimensioned diagram of the shipped TACT page layout: a 150 by 150mm square page with a 10mm margin, four short braille rows of 15 cells beside a 36.8 by 36mm illustration zone in the top-right corner at origin 103.2, 104, and nine full rows of 21 cells below.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="90" y="20" font-family="sans-serif" font-size="14" font-weight="500" fill="#1F1E1D">Square page, picture in the top-right corner (D023), the shipped layout</text>

<line x1="90" y1="32" x2="390" y2="32" stroke="#73726c" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="90" y1="34" x2="90" y2="60" stroke="#73726c" stroke-width="0.5"/>
<line x1="390" y1="34" x2="390" y2="60" stroke="#73726c" stroke-width="0.5"/>
<text x="240" y="46" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#82817A">150mm</text>

<line x1="56" y1="60" x2="56" y2="360" stroke="#73726c" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<line x1="58" y1="60" x2="90" y2="60" stroke="#73726c" stroke-width="0.5"/>
<line x1="58" y1="360" x2="90" y2="360" stroke="#73726c" stroke-width="0.5"/>
<text x="50" y="214" text-anchor="end" font-family="sans-serif" font-size="12" fill="#82817A">150mm</text>

<rect x="90" y="60" width="300" height="300" rx="20" fill="#F5F4ED" stroke="#1F1E1D" stroke-opacity="0.3" stroke-width="1"/>
<rect x="110" y="80" width="260" height="260" fill="none" stroke="#73726c" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.5"/>

<!-- 4 short rows: x 10 to 97.3, rows 1 to 4 -->
<rect x="110" y="80" width="175" height="72" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" opacity="0.6"/>
<text x="197" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">4 short rows</text>
<text x="197" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">15 cells each</text>

<!-- 9 full rows: x 10 to 136, rows 5 to 13 -->
<rect x="110" y="158" width="252" height="174" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5" opacity="0.85"/>
<text x="236" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">9 full rows</text>
<text x="236" y="254" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">21 cells each</text>

<!-- illustration: x 103.2 to 140, y 104 to 140 -->
<rect x="296.4" y="80" width="73.6" height="72" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="333.2" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#712B13">Picture</text>
<text x="333.2" y="126" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#993C1D">36.8 × 36mm</text>

<path d="M296.4 152 L384 152 L440 206" fill="none" stroke="#73726c" stroke-width="0.5" stroke-dasharray="2 2"/>
<circle cx="296.4" cy="152" r="2" fill="#73726c"/>
<text x="446" y="206" font-family="sans-serif" font-size="12" fill="#3D3D3A">Origin (103.2, 104)</text>
<text x="446" y="220" font-family="sans-serif" font-size="12" fill="#82817A" opacity="0.7">bottom-left of zone, 3.2mm above row 5</text>

<path d="M285 116 L289 68 L440 68" fill="none" stroke="#73726c" stroke-width="0.5" stroke-dasharray="2 2"/>
<circle cx="285" cy="116" r="2" fill="#73726c"/>
<text x="446" y="66" font-family="sans-serif" font-size="12" fill="#3D3D3A">Short rows end at x = 97.3</text>
<text x="446" y="80" font-family="sans-serif" font-size="12" fill="#82817A" opacity="0.7">5.9mm gap to the picture</text>

<line x1="362" y1="300" x2="440" y2="330" stroke="#73726c" stroke-width="0.5" stroke-dasharray="2 2"/>
<circle cx="362" cy="300" r="2" fill="#73726c"/>
<text x="446" y="330" font-family="sans-serif" font-size="12" fill="#3D3D3A">Full rows: x 10 → 136</text>
<text x="446" y="344" font-family="sans-serif" font-size="12" fill="#82817A" opacity="0.7">last row: 16 cells + page number</text>

<text x="90" y="400" font-family="sans-serif" font-size="14" font-weight="500" fill="#1F1E1D">window.TACT_LAYOUT constants</text>

<text x="90" y="426" font-family="monospace" font-size="12" fill="#3D3D3A">PAGE_W, PAGE_H</text>
<text x="250" y="426" font-family="monospace" font-size="12" fill="#82817A">150, 150</text>
<text x="90" y="446" font-family="monospace" font-size="12" fill="#3D3D3A">MARGIN</text>
<text x="250" y="446" font-family="monospace" font-size="12" fill="#82817A">10</text>
<text x="90" y="466" font-family="monospace" font-size="12" fill="#3D3D3A">TZ_X</text>
<text x="250" y="466" font-family="monospace" font-size="12" fill="#82817A">10</text>
<text x="90" y="486" font-family="monospace" font-size="12" fill="#3D3D3A">LINE_Y0</text>
<text x="250" y="486" font-family="monospace" font-size="12" fill="#82817A">135</text>
<text x="90" y="506" font-family="monospace" font-size="12" fill="#3D3D3A">PARA_INDENT</text>
<text x="250" y="506" font-family="monospace" font-size="12" fill="#82817A">2</text>

<text x="380" y="426" font-family="monospace" font-size="12" fill="#3D3D3A">LINE_H, CELL_W</text>
<text x="520" y="426" font-family="monospace" font-size="12" fill="#82817A">10, 6</text>
<text x="380" y="446" font-family="monospace" font-size="12" fill="#3D3D3A">LINE_WIDTHS</text>
<text x="520" y="446" font-family="monospace" font-size="12" fill="#82817A">[15×4, 21×8, 16]</text>
<text x="380" y="466" font-family="monospace" font-size="12" fill="#3D3D3A">ILL_X, ILL_Y</text>
<text x="520" y="466" font-family="monospace" font-size="12" fill="#82817A">103.2, 104</text>
<text x="380" y="486" font-family="monospace" font-size="12" fill="#3D3D3A">ILL_W, ILL_H</text>
<text x="520" y="486" font-family="monospace" font-size="12" fill="#82817A">36.8, 36</text>
<text x="380" y="506" font-family="monospace" font-size="12" fill="#3D3D3A">ILL_PIX</text>
<text x="520" y="506" font-family="monospace" font-size="12" fill="#82817A">0.4</text>

<line x1="90" y1="530" x2="620" y2="530" stroke="#73726c" stroke-width="0.5" opacity="0.3"/>
<text x="90" y="554" font-family="sans-serif" font-size="12" fill="#82817A" opacity="0.7">The story opens in cell 3 on page 1; every later line and page starts in cell 1</text>
<text x="90" y="570" font-family="sans-serif" font-size="12" fill="#82817A" opacity="0.7">Supersedes the bottom band (D022) and the first L-shape (D019)</text>
<text x="90" y="586" font-family="sans-serif" font-size="12" fill="#82817A" opacity="0.7">Single source of truth in index.html; the on-screen preview and STL generator both read from it</text>
</svg>
